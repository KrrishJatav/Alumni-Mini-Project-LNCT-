<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LNCT Bhopal — Alumni Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="honeycomb" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>
<div class="scrim" id="scrim"></div>

<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <svg class="mark" viewBox="0 0 30 34" aria-hidden="true">
        <path d="M15 0 29 8v18L15 34 1 26V8L15 0Zm0 4L5 10v14l10 6 10-6V10L15 4Z"/>
        <path d="M15 11l6 3.5v7L15 25l-6-3.5v-7L15 11Z" opacity=".55"/>
      </svg>
      <h1>LNCT Bhopal<span>Alumni directory</span></h1>
    </div>

    <div class="searchwrap">
      <div class="searchbox">
        <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-1.06 1.06ZM11.5 7a4.5 4.5 0 1 0-9 0 4.5 4.5 0 0 0 9 0Z"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               placeholder="Name, enrolment no. or year" aria-label="Search alumni"
               aria-controls="results" role="combobox" aria-expanded="true">
        <button id="clear" aria-label="Clear search">
          <svg width="14" height="14" viewBox="0 0 16 16"><path fill="currentColor" d="M2.343 13.657A8 8 0 1 1 13.658 2.343 8 8 0 0 1 2.343 13.657ZM6.03 4.97a.751.751 0 0 0-1.042.018.751.751 0 0 0-.018 1.042L6.94 8 4.97 9.97a.749.749 0 0 0 .326 1.275.749.749 0 0 0 .734-.215L8 9.06l1.97 1.97a.749.749 0 0 0 1.275-.326.749.749 0 0 0-.215-.734L9.06 8l1.97-1.97a.749.749 0 0 0-.326-1.275.749.749 0 0 0-.734.215L8 6.94Z"/></svg>
        </button>
        <span class="kbd">/</span>
      </div>
    </div>

    <div class="filters" id="years"></div>

    <div class="listhead">
      <span id="count">Everyone</span>
      <span id="sortnote">A–Z</span>
    </div>
    <div id="results" role="listbox" aria-label="Search results"></div>

    <div class="side-foot">
      <button id="addBtn" class="addbtn" type="button">
        <svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2Z"/></svg>
        Add student
      </button>
      <button id="exportBtn" class="exportbtn" type="button" title="Download every record as one CSV file">
        <svg width="14" height="14" viewBox="0 0 16 16"><path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14Z"/><path d="M7.25 7.689V2a.75.75 0 0 1 1.5 0v5.689l1.97-1.97a.749.749 0 1 1 1.06 1.06l-3.25 3.25a.749.749 0 0 1-1.06 0L4.22 6.779a.749.749 0 1 1 1.06-1.06l1.97 1.97Z"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px;min-width:0">
        <button id="drawer-btn" aria-label="Open search">
          <svg width="16" height="16" viewBox="0 0 16 16"><path d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75ZM1.75 12h12.5a.75.75 0 0 1 0 1.5H1.75a.75.75 0 0 1 0-1.5Z"/></svg>
        </button>
        <nav class="crumbs" id="crumbs">Alumni <span style="color:var(--fg-subtle)">/</span> <b>All records</b></nav>
      </div>
      <div class="bar-actions">
        <div class="toggle" role="group" aria-label="Colour theme">
          <button id="t-light" aria-pressed="false">
            <svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 12a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Zm5.657-8.157a.75.75 0 0 1 0 1.061l-1.061 1.06a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734l1.06-1.06a.75.75 0 0 1 1.06 0Zm-9.193 9.193a.75.75 0 0 1 0 1.06l-1.06 1.061a.75.75 0 1 1-1.061-1.06l1.06-1.061a.75.75 0 0 1 1.061 0ZM8 0a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0V.75A.75.75 0 0 1 8 0ZM3 8a.75.75 0 0 1-.75.75H.75a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 3 8Zm13 0a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 16 8ZM8 13a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 13ZM2.343 2.343a.75.75 0 0 1 1.061 0l1.06 1.061a.751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018l-1.06-1.06a.75.75 0 0 1 0-1.06Zm9.193 9.193a.75.75 0 0 1 1.06 0l1.061 1.06a.75.75 0 0 1-1.06 1.061l-1.061-1.06a.75.75 0 0 1 0-1.061Z"/></svg>
            Light
          </button>
          <button id="t-dark" aria-pressed="true">
            <svg width="14" height="14" viewBox="0 0 16 16"><path d="M9.598 1.591a.749.749 0 0 1 .785-.175 7.001 7.001 0 1 1-8.967 8.967.75.75 0 0 1 .961-.96 5.5 5.5 0 0 0 7.046-7.046.75.75 0 0 1 .175-.786Zm1.616 1.945a7 7 0 0 1-7.678 7.678 5.499 5.499 0 1 0 7.678-7.678Z"/></svg>
            Dark
          </button>
        </div>
      </div>
    </header>
    <div class="stage" id="stage"></div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">Add a student</h2>
      <button type="button" class="modal-x" id="modalClose" aria-label="Close">
        <svg width="15" height="15" viewBox="0 0 16 16"><path fill="currentColor" d="M2.343 13.657A8 8 0 1 1 13.658 2.343 8 8 0 0 1 2.343 13.657ZM6.03 4.97a.751.751 0 0 0-1.042.018.751.751 0 0 0-.018 1.042L6.94 8 4.97 9.97a.749.749 0 0 0 .326 1.275.749.749 0 0 0 .734-.215L8 9.06l1.97 1.97a.749.749 0 0 0 1.275-.326.749.749 0 0 0-.215-.734L9.06 8l1.97-1.97a.749.749 0 0 0-.326-1.275.749.749 0 0 0-.734.215L8 6.94Z"/></svg>
      </button>
    </div>

    <form id="addForm" class="modal-body" novalidate>
      <div class="frow frow-2">
        <div class="field"><label for="f-n">Full name *</label><input id="f-n" required></div>
        <div class="field"><label for="f-e">Enrolment number *</label><input id="f-e" class="mono" required></div>
      </div>
      <div class="frow frow-3">
        <div class="field"><label for="f-y">Passing year *</label><input id="f-y" type="number" min="2000" max="2100" required></div>
        <div class="field"><label for="f-b">Branch *</label>
          <select id="f-b" required>
            <option value="CS">Computer Science</option>
            <option value="IT">Information Technology</option>
            <option value="EC">Electronics & Communication</option>
            <option value="ME">Mechanical Engineering</option>
            <option value="CE">Civil Engineering</option>
            <option value="EX">Electrical & Electronics</option>
          </select>
        </div>
        <div class="field"><label for="f-cg">CGPA</label><input id="f-cg" type="number" step="0.01" min="0" max="10"></div>
      </div>

      <div class="frow frow-2">
        <div class="field"><label for="f-city">City</label><input id="f-city"></div>
        <div class="field"><label for="f-ph">Phone</label><input id="f-ph"></div>
      </div>
      <div class="frow frow-2">
        <div class="field"><label for="f-em">Email</label><input id="f-em" type="email"></div>
        <div class="field"><label for="f-li">LinkedIn (e.g. in/jane-doe)</label><input id="f-li"></div>
      </div>
      <div class="frow frow-2">
        <div class="field"><label for="f-gh">GitHub username</label><input id="f-gh"></div>
        <div class="field"><label for="f-pf">Portfolio website link</label><input id="f-pf" type="url" placeholder="https://janedoe.dev"></div>
      </div>
      <div class="field"><label for="f-st">Status *</label>
        <select id="f-st" required>
          <option value="placed">Placed</option>
          <option value="higher">Higher studies</option>
          <option value="founder">Entrepreneur</option>
          <option value="seeking">Open to roles</option>
        </select>
      </div>

      <div class="frow frow-3">
        <div class="field"><label for="f-co">Company / institute</label><input id="f-co"></div>
        <div class="field"><label for="f-role">Role / programme</label><input id="f-role"></div>
        <div class="field"><label for="f-ctc">Package / label</label><input id="f-ctc" placeholder="₹10.0 LPA"></div>
      </div>
      <div class="field"><label for="f-ptype">Placement route</label><input id="f-ptype" placeholder="On-campus, Off-campus, Higher studies…"></div>

      <div class="field">
        <label for="f-sk">Skills</label>
        <input id="f-sk" placeholder="Python:4, React:3, SQL:4">
        <p class="fhint">Comma-separated. Add ":level" (1–5) after a skill, or leave it off for a default of 3.</p>
      </div>

      <div class="frow frow-2">
        <div class="field"><label for="f-pjt">Project title</label><input id="f-pjt"></div>
        <div class="field"><label for="f-pjl">Primary language</label><input id="f-pjl" placeholder="Python"></div>
      </div>
      <div class="field"><label for="f-pjd">Project description</label><input id="f-pjd"></div>
      <div class="field"><label for="f-pjx">Tech stack</label><input id="f-pjx" placeholder="Flask · Postgres"></div>

      <p class="fhint" id="formError" role="alert"></p>
    </form>

    <div class="modal-foot">
      <button type="button" class="btn-ghost" id="modalCancel">Cancel</button>
      <button type="submit" form="addForm" class="btn-primary" id="saveBtn">Add student</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
